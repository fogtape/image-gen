services:
  image-gen:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      IMAGE_GEN_RUNTIME: node
      IMAGE_GEN_DATA_DIR: /app/data
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
